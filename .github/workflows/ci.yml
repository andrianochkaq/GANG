name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR target, branch, title and commits (docs/conventions.md)
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$BRANCH" = "dev" ]; then
            echo "Release PR dev -> main: naming checks skipped."; exit 0
          fi
          fail=0
          branch_re='^(feature|bugfix|hotfix|refactor|chore|docs|test|ci)/[a-z0-9]+(-[a-z0-9]+){1,2}$'
          subject_re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z0-9].*[^.]$'
          ticket_re='(FC-[0-9]+|#[0-9]+)'
          title_re='^(#[0-9]+ )?[A-Z].*[^.]$'
          if [ "$BASE_REF" != "dev" ]; then
            echo "::error::PRs must target dev, not $BASE_REF. Only the release PR dev -> main may target main."; fail=1
          fi
          if [[ ! "$BRANCH" =~ $branch_re ]]; then
            echo "::error::Branch '$BRANCH' must be {type}/{2-3-word-summary} without ticket numbers, e.g. feature/add-user-model"; fail=1
          fi
          if [[ ! "$TITLE" =~ $title_re ]]; then
            echo "::error::PR title '$TITLE' must be '#17 Add custom user model': issue number first, capitalized, no full stop"; fail=1
          fi
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            subject="$(git log -1 --format=%s "$sha")"
            if [[ ! "$subject" =~ $subject_re ]]; then
              echo "::error::Commit ${sha:0:7} '$subject' must be '<type>(<scope>): <description>' (lowercase description, no full stop)"; fail=1
            elif [[ "$subject" =~ $ticket_re ]]; then
              echo "::error::Commit ${sha:0:7} subject must not contain ticket numbers; put 'Refs #N' in the footer"; fail=1
            elif [ "${#subject}" -gt 50 ]; then
              echo "::error::Commit ${sha:0:7} subject is ${#subject} characters; the limit is 50"; fail=1
            fi
            while IFS= read -r line; do
              if [ "${#line}" -gt 72 ] && [[ "$line" != *http* ]]; then
                echo "::error::Commit ${sha:0:7} body line longer than 72 characters: '${line:0:40}...'"; fail=1
              fi
            done < <(git log -1 --format=%b "$sha")
          done
          [ "$fail" = 0 ] && echo "Names and target follow docs/conventions.md."
          exit "$fail"

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freecook
          POSTGRES_USER: freecook
          POSTGRES_PASSWORD: freecook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freecook" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://freecook:freecook@localhost:5432/freecook
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-secret
      JWT_SIGNING_KEY: ci-only-jwt
      DEBUG: "0"
      CELERY_TASK_ALWAYS_EAGER: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend
        id: detect
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No backend yet - skipping."; fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: |
          if command -v ruff >/dev/null; then ruff check .; else echo "ruff not installed - skipping"; fi
          if command -v black >/dev/null; then black --check .; else echo "black not installed - skipping"; fi
      - name: Migrations are up to date
        if: steps.detect.outputs.present == 'true' && hashFiles('backend/manage.py') != ''
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        run: |
          if command -v pytest >/dev/null; then pytest -q; else python manage.py test; fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No frontend yet - skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint and type-check
        if: steps.detect.outputs.present == 'true'
        run: |
          npm run lint --if-present
          npm run typecheck --if-present
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        run: npm run test --if-present
        env:
          CI: "true"
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build --if-present

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          if [ ! -f docker-compose.yml ]; then echo "No docker-compose.yml yet - skipping."; exit 0; fi
          if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
          docker compose -f docker-compose.yml build
